name: minidsp-shd
components:
  - id: main
    capabilities:
      - id: audioVolume
        version: 1
      - id: switch
        version: 1
    categories:
      - name: Speaker
preferences:
  - title: "Volumio IP Address"
    name: ipAddress
    description: "IP address of the Volumio / MiniDSP SHD device on your local network"
    required: true
    preferenceType: string
    definition:
      minLength: 7
      maxLength: 39
      stringType: text
      default: "192.168.1.100"
  - title: "Volumio Port"
    name: port
    description: "HTTP port of the Volumio server (default: 80)"
    required: false
    preferenceType: integer
    definition:
      minimum: 1
      maximum: 65535
      default: 80
  - title: "Poll Interval (seconds)"
    name: pollInterval
    description: "How often to refresh device state from Volumio"
    required: false
    preferenceType: integer
    definition:
      minimum: 5
      maximum: 300
      default: 30
